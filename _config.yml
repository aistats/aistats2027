    people:
    - family: Ramdas
      given: Aaditya
      url: https://www.stat.cmu.edu/~aramdas/
      institute: Carnegie Mellon University
    - family: Solin
      given: Arno
      url:
      institute: ELLIS Institute Finland / Aalto University
  - type: Program Chairs
    people:
