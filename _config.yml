# AISTATS 2027 conference site settings

title: Artificial Intelligence and Statistics Conference
description: >-
  Website for the AISTATS 2027 conference (Artificial Intelligence and Statistics).
url: "https://aistats.org"
baseurl: "/aistats2027/"

# Deadline display timezone for listdates.html (AOE = Anywhere on Earth, end of day).
# Override per deadline with tz: UTC (or CEST, …). Do not embed AoE in date strings.
timezone: AOE

repository: aistats/aistats2027

# Conference Twitter/X handle (shared society account is fine)
twitter_username: aistats_conf

github_username: aistats

author:
  name: AISTATS
  # Conference contact mailbox
  email: aistats2027@gmail.com
comments: false

markdown: kramdown
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-remote-theme
encoding: utf-8
remote_theme: aistats/jekyll-theme
# Selects AISTATS CSS, favicon, and style-specific includes in the shared theme.
style: aistats

ghub:
  edit: true
  repository: aistats2027

# Banner file must live under assets/images/
banner: resort.png
banner_title: Artificial Intelligence and Statistics 2027

conference:
  full_name: Artificial Intelligence and Statistics
  short_name: AISTATS
  name: Artificial Intelligence and Statistics
  # True while the public programme is still draft
  draft: true
  # True to hide speakers marked tentative
  hide_tentative: true
  # Optional venue photo under assets/images/
  image: conference-venue.png
  proceedings:
    # PMLR (or other) proceedings URL once published
    url:
    show: false
  room:
  # Venue TBA (virtual: dates & venue coming soon)
  venue:
  venue_url:
  # City, Country — announced as Montréal for 2027
  location: Montréal, Canada
  year: 2027
  # Ordinal instance
  instance: 30th
  styling: International Conference on

  # Conference meeting days: one YAML list entry per calendar day (not a single
  # range string). Leave TBA until meeting dates are confirmed.
  dates:
  - TBA

  # OpenReview (or other) submission site
  submission:
    show: false
    url:
    name: OpenReview

  # Key dates shown on dates.md via {% include listdates.html %}.
  # Store parseable date/enddate/time values only. Site timezone: AOE.
  # Seeded from virtual.aistats.org/Conferences/2027 announcements (Sep 2026).
  deadlines:
    - name: Abstract submission deadline
      type: submission
      date: 29 September 2026
      important: true
    - name: Paper submission deadline
      type: submission
      date: 6 October 2026
      important: true
    - name: Reviews released
      type: review
      date: 16 November 2026
      important: true
    - name: Paper decision notifications
      type: decision
      date: 20 January 2027
      important: true
    - name: Camera-ready deadline
      type: submission
      date:
      important: true
    - name: Conference dates
      type: submission
      date:
      enddate:
      important: true

  # Organising chairs (from virtual.aistats.org/virtual/2027/organizers).
  chairs:
